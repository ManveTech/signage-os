<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignageOS Player</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Pairing Screen -->
    <div id="pairing-screen" class="screen active">
        <div class="pairing-content">
            <div class="card">
                <h2>Connect Your Display</h2>
                <p>Enter this 6-character code in your SignageOS Admin Dashboard to link this TV screen.</p>
                <div id="pairing-code" class="code-display">------</div>
                <button id="refresh-code-btn" class="btn">Get New Code</button>
                <p class="small-text">Status: <span id="pairing-status-message">Awaiting pairing from dashboard...</span></p>
            </div>
        </div>
    </div>

    <!-- Standby / Idle Screen -->
    <div id="standby-screen" class="screen">
        <div class="standby-content">
            <div class="card">
                <h2>Standby Mode</h2>
                <p>No playlist assigned to this screen. Please assign a playlist from the SignageOS Dashboard.</p>
            </div>
        </div>
    </div>

    <!-- Playback Screen -->
    <div id="playback-screen" class="screen">
        <div id="media-container" class="fullscreen-container">
            <img id="image-player-1" class="media-element active" src="" alt="Content" style="display: none;">
            <img id="image-player-2" class="media-element" src="" alt="Content" style="display: none;">
            <video id="video-player" class="media-element" style="display: none;" preload="auto" playsinline></video>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script src="js/keys.js"></script>
    <script src="app.js"></script>
</body>
</html>
