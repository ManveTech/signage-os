server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # nginx's bundled mime.types has no entry for .mjs. Without this, the
    # pdf.js worker went out as application/octet-stream and the browser
    # refused to execute it — "Setting up fake worker failed: Failed to fetch
    # dynamically imported module" — even though nginx served the file
    # perfectly: 200, all 1.4MB of it. A module script is rejected on its
    # Content-Type alone, so a correct file with the wrong type is a 200 that
    # behaves like a 404.
    #
    # The bundled map is included first and added to, rather than declared
    # fresh: a bare `types` block at this level replaces the whole table
    # instead of extending it, which would leave every other extension
    # unmapped.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Routing is HashRouter (src/main.tsx), so every route lives after a '#'
    # and nginx only ever sees '/' and real files.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite puts a content hash in every name here, so a given URL is immutable
    # and the pdf.js chunks — over a megabyte, fetched the first time someone
    # uploads a PDF — are fetched once per build rather than once per upload.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # Deliberately no SPA fallback. A `try_files ... /index.html` catch-all
    # would have answered this missing-worker case with an HTML page under a
    # 200, and a dynamic import failing on a page of HTML says nothing about
    # why. A missing file returns a real 404 so broken references stay visible.
    location / {
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
