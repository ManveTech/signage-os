<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=block" rel="stylesheet"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{position:relative;background:#f3f6fc;font-family:Outfit,sans-serif;color:#0b2545}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(11,37,69,.09) 2px,transparent 2.5px);background-size:36px 36px;
 -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.4) 40%,transparent 60%)}
.panel{position:absolute;left:0;right:0;top:1040px;bottom:0;background:linear-gradient(160deg,#1d4ed8 0%,#123a8f 45%,#0b2545 100%);border-top-left-radius:220px}
.panel:after{content:'';position:absolute;right:-180px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.45),rgba(96,165,250,0) 70%)}
.head{position:absolute;left:84px;right:84px;top:110px}
.label{display:inline-flex;align-items:center;gap:14px;background:#fff;border:2px solid #dbe5f7;border-radius:999px;padding:12px 26px 12px 14px;
 font:600 28px/1 Outfit;color:#0b2545;box-shadow:0 6px 18px rgba(11,37,69,.06)}
.label span{background:#2563eb;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:24px}
.title{font:800 98px/1.02 Outfit;letter-spacing:-.025em;margin:40px 0 0;max-width:900px;text-wrap:balance}
.title b{font-weight:800;color:#2563eb}
.sub{font:400 36px/1.4 Outfit;color:#4b5b75;margin:28px 0 0;max-width:820px;text-wrap:balance}
.phone{position:absolute;left:400px;top:690px;width:600px;height:1300px;border-radius:72px;background:#0c1424;padding:16px;box-sizing:border-box;
 transform:rotate(-4deg);transform-origin:50% 0;box-shadow:0 50px 100px rgba(11,37,69,.35),0 0 0 2px rgba(255,255,255,.08) inset}
.phone .screen{width:100%;height:100%;border-radius:58px;overflow:hidden;background:#f7f9fc}.phone img{width:100%;display:block}
.card{position:absolute;background-repeat:no-repeat;background-color:#fff;
 box-shadow:0 0 0 4px #fff,0 0 0 7px #2563eb,0 36px 70px rgba(11,37,69,.38)}
.product{position:absolute;left:40px;bottom:120px;height:640px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
.floor{position:absolute;left:30px;bottom:96px;width:420px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%)}
</style></head><body>
<div class="dots"></div>
<div class="panel"></div>
<div class="head"><div class="label"><span>01</span>Your network</div><h1 class="title">Every screen, <b>at a glance</b></h1><p class="sub">See what’s online, what’s playing and what needs you.</p></div>
<div class="phone"><div class="screen"><img src="raw/dashboard.png"></div></div>
<div class="floor"></div>
<img class="product" src="../marketing-site/public/products/standee.webp">
<div class="card" style="left:170px;top:882px;width:545px;height:238px;border-radius:26px;
      background-image:url(raw/dashboard.png);background-size:636.2px auto;background-position:-45.7px -246.6px"></div>
</body></html>
