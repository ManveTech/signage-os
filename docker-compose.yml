# BLUESTAR — the API, the admin dashboard and the public website in one Docker Compose
# deployment.
#
# Used by the Coolify resource "Frontend" (Base Directory "/", Compose Location
# "/docker-compose.yml"). Each service is its own container, so in Coolify each gets its own
# domain(s) and its own logs, and one app crashing doesn't take the others down.
#
#   service   builds from            domain(s) to set in Coolify
#   api       server/Dockerfile      api.bluestardigitech.com, dem1.manve.co
#   cms       Dockerfile             cms.bluestardigitech.com, blu.manve.co
#   website   marketing-site/        bluestardigitech.com, www.bluestardigitech.com
#
# dem1.manve.co is LEGACY AND LOAD-BEARING. Every TV already in the field has it compiled in
# (tv-signage-player AppConfig.kt, tizen/js/config.js) and the Android player force-overwrites
# any stored URL back to it on boot — so a deployed TV cannot be repointed remotely. It has to
# stay on `api` until every TV has a new build installed. Same story for demo.manve.co, which
# must keep pointing at PocketBase.
#
# This replaced the "Bluestar-Server" Coolify app, which built the same server/Dockerfile from
# its own server/docker-compose.yml. That compose also started a redis:alpine sidecar which
# nothing used, because REDIS_URL always pointed at the Coolify Redis instead.
#
# All settings live in ONE place: the Environment Variables screen of this Coolify resource
# (or a .env file next to this one when running `docker compose up -d --build` yourself).
# See .env.example for the full list.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- the API
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Set explicitly so a missing secret fails loudly at boot rather than silently falling
      # back to the dev defaults in server/config.ts. The old server/docker-compose.yml left
      # this unset, so the API was running in development mode in production.
      NODE_ENV: production
      PORT: "5000"

      # Used in password-reset links and the "open the enquiry" button in lead emails, so it
      # points at the dashboard, not at this service.
      APP_URL: ${CMS_PUBLIC_URL:-https://cms.bluestardigitech.com}

      # --- database -----------------------------------------------------------------
      POCKETBASE_URL: ${POCKETBASE_URL}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}

      # --- auth ---------------------------------------------------------------------
      JWT_SECRET: ${JWT_SECRET}

      # --- who may call this API from a browser --------------------------------------
      # Everything here is cross-origin now: the dashboard lives on cms.*, the website on the
      # apex. Miss one and the browser silently discards that app's responses. Unset would
      # mean "*", which would let any site on the internet post enquiries.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cms.bluestardigitech.com,https://bluestardigitech.com,https://www.bluestardigitech.com,https://blu.manve.co}

      # --- optional services --------------------------------------------------------
      # SMTP and R2 can also be set in the dashboard under Integrations, which takes priority
      # over anything here once enabled. The rest are env-only.
      REDIS_URL: ${REDIS_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      S3_ENABLED: ${S3_ENABLED:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      # /health/live only reports that the process is up. The richer /health also queries
      # PocketBase, pings Redis and opens an R2 connection — using that here would have Docker
      # kill the container whenever a dependency blipped, which a restart does not fix.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  # ------------------------------------------------------- the admin dashboard
  cms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Absolute, because the dashboard and the API are now separate origins.
        VITE_NODE_SERVER_URL: ${API_PUBLIC_URL:-https://api.bluestardigitech.com}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck: &web-health
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # -------------------------------------------------------- the public website
  website:
    build:
      context: ./marketing-site
      args:
        # Where the enquiry form posts and the contact details are read from.
        VITE_CMS_API: ${API_PUBLIC_URL:-https://api.bluestardigitech.com}/api/v1
    environment:
      PORT: "80"
    expose:
      - "80"
    restart: unless-stopped
    healthcheck: *web-health
    logging: *logging
