# The CMS — one container, two domains
#
#   cms.bluestardigitech.com   the dashboard and its login
#   api.bluestardigitech.com   what the TVs poll and the marketing site posts to
#
# Both names point at this same service. Express serves /api/v1 and the built
# dashboard together, so the dashboard loaded from cms.* talks to /api/v1 on
# cms.* — same-origin, no CORS between the dashboard and its own API — while
# TVs and the public site use the stable api.* name.
#
# This replaces the old split of Bluestar-Server (API) + Frontend (static
# dashboard). The service is named `cms`, not `frontend` as it was before: in
# Coolify, re-assign the domains after "Reload Compose File", because the
# domain fields are bound to the service name.
#
# The marketing site (bluestardigitech.com) is a separate image built from
# ./marketing-site with its own compose file — point that domain at it.

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: bluestar-cms:latest
    restart: always
    # "0:5000" lets the host port be chosen at deploy time and the proxy map
    # the domains to it — the same pattern the previous compose used for :80.
    ports:
      - "0:5000"
    expose:
      - "5000"
    environment:
      # --- core ---------------------------------------------------------
      NODE_ENV: production
      PORT: 5000
      # Used in password-reset links and the "open the enquiry" button in
      # lead notification emails, so it must be the public origin.
      APP_URL: ${APP_URL}

      # --- database -----------------------------------------------------
      POCKETBASE_URL: ${POCKETBASE_URL}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}

      # --- auth ---------------------------------------------------------
      JWT_SECRET: ${JWT_SECRET}

      # --- who may call the API from a browser --------------------------
      # The marketing site calls api.* cross-origin, so both the apex and www
      # must be listed or the browser discards the enquiry form's response.
      # cms.* belongs here too for anything the dashboard fetches by absolute
      # URL. Unset means "*", which lets any site on the internet post
      # enquiries — set it.
      #   https://bluestardigitech.com,https://www.bluestardigitech.com,https://cms.bluestardigitech.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # --- optional services --------------------------------------------
      # SMTP and R2 can also be configured in the dashboard under
      # Integrations, which takes priority over anything set here.
      REDIS_URL: ${REDIS_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
