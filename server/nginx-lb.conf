# Load balancer for running multiple server instances behind one entry point.
#
# This is the missing piece for item 4 of the scaling plan (horizontal
# scaling) — it only works correctly now that:
#   - the Socket.IO Redis adapter is wired up (server/index.ts), so a room
#     broadcast reaches sockets connected to ANY instance, not just the one
#     that triggered it, and
#   - video-conference state lives in Redis (server/videoConferenceState.ts),
#     not in one process's memory.
# Deploying this without those two already in place would silently break
# video calls the moment a request landed on a different instance than the
# one that started the conference.
#
# ip_hash pins each client to the same backend for the life of its connection.
# This matters for Socket.IO's HTTP long-polling handshake (used by browser
# dashboard clients before upgrading to a websocket) — without it, the
# handshake's follow-up requests can land on a different instance mid-negotiation
# and fail to connect. The Android TV app connects websocket-only, so it
# doesn't strictly need this, but it's the correct universal default when both
# kinds of client exist.
upstream signage_backend {
    ip_hash;

    server app1:5000;
    server app2:5000;
    server app3:5000;
    # Add or remove `server` lines to match however many replicas you're
    # actually running — this list isn't automatic.
}

server {
    listen 80;

    # Required for Socket.IO — without Upgrade/Connection headers, nginx
    # proxies WebSocket traffic as plain HTTP and every realtime feature
    # (video calls, the config-changed push, chat) breaks.
    location /socket.io/ {
        proxy_pass http://signage_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s; # keep long-lived websocket connections open
    }

    location / {
        proxy_pass http://signage_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
