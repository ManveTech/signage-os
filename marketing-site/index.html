<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluestar Digitech | Digital Signage, Touch Kiosks &amp; LED Video Walls</title>
    <meta name="description" content="Bluestar Digitech is an ISO 9001:2015 certified manufacturer of digital standees, interactive touch kiosks, active LED video walls, and custom sheet metal enclosures in Bangalore, India." />
    <meta name="keywords" content="digital signage manufacturer, touch kiosks Bangalore, LED video walls India, digital standees, interactive coffee tables, sheet metal fabrication Peenya" />
    <meta name="author" content="Bluestar Digitech" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#0b2545" />
    <link rel="canonical" href="https://bluestardigitech.com/" />

    <!-- Icons -->
    <!-- The B mark, generated from assets/masters/brand/bluestar-icon.png.
         There is no SVG: the logo is a raster with gradients, so the previous
         favicon.svg was a hand-drawn five-point star that had nothing to do
         with the brand. PNGs at three sizes instead, so the browser picks
         rather than scaling 32px up to a 180px tab strip. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-180.png" sizes="180x180" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bluestardigitech.com/" />
    <meta property="og:title" content="Bluestar Digitech | Digital Signage, Touch Kiosks &amp; LED Video Walls" />
    <meta property="og:description" content="ISO 9001:2015 certified manufacturer of digital standees, interactive touch kiosks, active LED video walls, and precision sheet metal enclosures in Peenya, Bangalore." />
    <meta property="og:site_name" content="Bluestar Digitech" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://bluestardigitech.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bluestar Digitech — digital signage, touch kiosks and LED video walls fabricated in Peenya, Bangalore." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bluestar Digitech | Digital Signage &amp; Kiosk Manufacturer" />
    <meta name="twitter:description" content="In-house CNC sheet metal fabrication, digital standees, touch kiosks, and LED video walls built in Peenya, Bangalore." />
    <meta name="twitter:image" content="https://bluestardigitech.com/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Caveat:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- The hero paints these immediately; without the hint they wait on the JS bundle. -->
    <link rel="preload" as="image" href="/brand/bluestar-logo.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/products/standee.webp" fetchpriority="high">

    <!--
      Structured data. The FAQPage block is emitted by FaqSection.tsx instead of
      being duplicated here, so the markup can never drift from the questions the
      page actually shows. Do not add a telephone, aggregateRating or client list
      here until those are confirmed by the client — invented values get the
      whole graph ignored.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bluestardigitech.com/#website",
          "url": "https://bluestardigitech.com/",
          "name": "Bluestar Digitech",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://bluestardigitech.com/#org" }
        },
        {
          "@type": ["Organization", "LocalBusiness"],
          "@id": "https://bluestardigitech.com/#org",
          "name": "Bluestar Digitech",
          "legalName": "Blue Star Metacraft",
          "description": "ISO 9001:2015 certified manufacturer of digital standees, interactive touch kiosks, active LED video walls, and custom sheet metal enclosures in Bangalore, India.",
          "url": "https://bluestardigitech.com/",
          "logo": "https://bluestardigitech.com/apple-touch-icon.png",
          "image": "https://bluestardigitech.com/og-image.jpg",
          "email": "info@bluestarmetacraft.com",
          "telephone": "+918095851597",
          "foundingDate": "2015",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Plot No. 23, 13th Cross, Doddanna Industrial Area, Peenya 2nd Stage",
            "addressLocality": "Bangalore",
            "addressRegion": "Karnataka",
            "postalCode": "560091",
            "addressCountry": "IN"
          },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+918095851597",
              "email": "info@bluestarmetacraft.com",
              "areaServed": "IN",
              "availableLanguage": ["en", "kn", "hi"]
            },
            {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "telephone": "+918028369267",
              "areaServed": "IN"
            }
          ],
          "areaServed": { "@type": "Country", "name": "India" },
          "hasCredential": "ISO 9001:2015",
          "knowsAbout": [
            "Digital Signage",
            "Interactive Touch Kiosks",
            "Active LED Video Walls",
            "CNC Sheet Metal Fabrication",
            "CNC Laser Cutting",
            "Press Brake Bending",
            "Powder Coating"
          ],
          "makesOffer": [
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Floor Standing Digital Standee" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "A-Type Digital Standee" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Self-Service Kiosk" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Information Kiosk" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Digital Podium" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Multi-Touch Table" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Digital Coffee Table" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Active LED Video Wall" } }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#d5e5f7] text-[#0b2545] antialiased selection:bg-[#0b2545] selection:text-[#d5e5f7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
