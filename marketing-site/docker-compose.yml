# The marketing site — bluestardigitech.com
#
# Deploy this as its own service and point the apex (and www) at it. The CMS is
# a separate service built from the repo root; point cms.bluestardigitech.com
# at that one.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time, because Vite inlines it. Must match the CMS's public
        # origin, and that origin must list this site in CORS_ALLOWED_ORIGINS
        # or the browser discards the enquiry form's response.
        - VITE_CMS_API=${VITE_CMS_API:-https://cms.bluestardigitech.com/api/v1}
    image: bluestar-digitech:latest
    container_name: bluestar-digitech-app
    restart: unless-stopped
    environment:
      - PORT=${PORT:-80}
    # No fixed host port assigned — automatically decided during deployment / ingress proxy
    expose:
      - "${PORT:-80}"
    ports:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:$${PORT:-80}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
